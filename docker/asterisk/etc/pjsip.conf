[global]
type=global
user_agent=Vicidial-Asterisk

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

; Agent endpoint example
[1001-auth]
type=auth
auth_type=userpass
username=1001
password=VicidialPhone1001!ChangeNow

[1001-aor]
type=aor
max_contacts=1

[1001-endpoint]
type=endpoint
context=from-internal
disallow=all
allow=ulaw,alaw
auth=1001-auth
aors=1001-aor
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[1001]
type=identify
endpoint=1001-endpoint
match=0.0.0.0/0

; Carrier trunk template
[carrier-auth]
type=auth
auth_type=userpass
username=YOUR_CARRIER_USERNAME
password=YOUR_CARRIER_PASSWORD

[carrier-aor]
type=aor
contact=sip:sip.carrier.example
qualify_frequency=30

[carrier-endpoint]
type=endpoint
transport=transport-udp
context=from-carrier
disallow=all
allow=ulaw,alaw
outbound_auth=carrier-auth
aors=carrier-aor
from_domain=sip.carrier.example
dtmf_mode=rfc4733
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[carrier-identify]
type=identify
endpoint=carrier-endpoint
match=203.0.113.10

[carrier-registration]
type=registration
transport=transport-udp
outbound_auth=carrier-auth
server_uri=sip:sip.carrier.example
client_uri=sip:YOUR_CARRIER_USERNAME@sip.carrier.example
retry_interval=60
