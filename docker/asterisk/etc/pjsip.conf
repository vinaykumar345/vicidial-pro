[global]
type=global
user_agent=Vicidial-Asterisk

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_media_address=192.168.2.85
external_signaling_address=192.168.2.85
local_net=172.16.0.0/12
local_net=192.168.0.0/16
local_net=10.0.0.0/8

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060
external_signaling_address=192.168.2.85
local_net=172.16.0.0/12
local_net=192.168.0.0/16
local_net=10.0.0.0/8

; Agent endpoint example
[1001-auth]
type=auth
auth_type=userpass
username=1001
password=VicidialPhone1001!ChangeNow

[1001-aor]
type=aor
max_contacts=1

[1001-endpoint]
type=endpoint
context=from-internal
disallow=all
allow=ulaw,alaw
auth=1001-auth
aors=1001-aor
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[1001]
type=identify
endpoint=1001-endpoint
match=0.0.0.0/0

