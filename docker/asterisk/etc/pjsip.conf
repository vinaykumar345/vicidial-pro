; Carrier trunk template
[carrier-auth]
type=auth
auth_type=userpass
username=YOUR_CARRIER_USERNAME
password=YOUR_CARRIER_PASSWORD

[carrier-aor]
type=aor
contact=sip:sip.carrier.example
qualify_frequency=30

[carrier-endpoint]
type=endpoint
transport=transport-udp
context=from-carrier
disallow=all
allow=ulaw,alaw
outbound_auth=carrier-auth
aors=carrier-aor
from_domain=sip.carrier.example
dtmf_mode=rfc4733
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[carrier-identify]
type=identify
endpoint=carrier-endpoint
match=203.0.113.10

[carrier-registration]
type=registration
transport=transport-udp
outbound_auth=carrier-auth
server_uri=sip:sip.carrier.example
client_uri=sip:YOUR_CARRIER_USERNAME@sip.carrier.example
retry_interval=60
